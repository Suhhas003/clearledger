openapi: 3.1.0
info:
  title: ClearLedger Core-Banking API
  version: 1.0.0
  description: >
    Production-grade double-entry core-banking ledger engine API.
    Features cryptographic idempotency, strict PostgreSQL row-level ACID transactions,
    role-based access control (CUSTOMER, TELLER, ADMIN), mathematical invariant auditing,
    and PDF mini-statement generation.
    
    DISCLAIMER: ClearLedger uses educational virtual money and virtual IBAN identifiers.
    It is not a licensed financial institution or real-world payment network.

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://clearledger.vercel.app
    description: Production deployment

paths:
  /api/auth/{nextauth}:
    summary: Auth.js (NextAuth) Authentication Handlers
    description: >
      Handles credential authentication, session retrieval, CSRF validation, and provider enumeration.
    parameters:
      - name: nextauth
        in: path
        required: true
        description: NextAuth action route (signin, callback/credentials, session, csrf, providers)
        schema:
          type: string
          example: session
    get:
      summary: Get auth session or CSRF token
      responses:
        '200':
          description: Active session state or CSRF details
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  expires:
                    type: string
                    format: date-time
    post:
      summary: Authenticate via Credentials provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: operator@clearledger.internal
                password:
                  type: string
                  format: password
                  example: StrongPassword123!
      responses:
        '200':
          description: Successfully authenticated; sets HTTP-only JWT session cookie.
        '401':
          description: Invalid email or password credentials.

  /api/accounts:
    get:
      summary: List authorized accounts
      description: >
        Returns accounts authorized for the authenticated user.
        CUSTOMERS see only accounts they own.
        TELLER and ADMIN see all accounts, optionally filtered by userId.
      parameters:
        - name: userId
          in: query
          required: false
          description: Filter accounts by user ID (Staff only)
          schema:
            type: string
      responses:
        '200':
          description: List of account records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/401Unauthorized'

    post:
      summary: Open new core-banking account
      description: >
        Opens a new CURRENT or SAVINGS account with zero initial balance and issues an ISO 13616 virtual IBAN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum: [CURRENT, SAVINGS]
                  example: CURRENT
                currency:
                  type: string
                  default: USD
                  example: USD
                userId:
                  type: string
                  description: Target user ID (Staff only; customers always own their created accounts)
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/accounts/{id}:
    get:
      summary: Retrieve account details and ledger audit trail
      description: >
        Returns account metadata and the 20 most recent ledger postings.
        Enforces ownership check for CUSTOMER role.
      parameters:
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: string
      responses:
        '200':
          description: Account detail with recent postings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /api/transfers:
    post:
      summary: Execute atomic double-entry transfer
      description: >
        Performs an atomic, retry-safe transfer between two accounts with strict row-locking,
        idempotency validation, and double-entry balance updates.
      headers:
        Idempotency-Key:
          schema:
            type: string
            format: uuid
          required: false
          description: Client-supplied UUIDv4 idempotency key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fromAccountId
                - toAccountId
                - amount
              properties:
                fromAccountId:
                  type: string
                  description: Debtor account ID
                  example: cmuzyjf690005w70swd8aartk
                toAccountId:
                  type: string
                  description: Creditor account ID
                  example: cmuzyjfi00007w70s9w76ru4v
                amount:
                  type: string
                  description: Transfer amount in decimal dollars (e.g. "50.00") or integer cents (e.g. "5000").
                  example: "50.00"
                currency:
                  type: string
                  default: USD
                  example: USD
                description:
                  type: string
                  example: Invoice payment
      responses:
        '201':
          description: Transfer executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '200':
          description: Idempotent replay of previously completed transfer
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                example: "true"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          description: Idempotency conflict (request currently in progress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Idempotency payload mismatch or ledger constraint violation (insufficient funds, frozen account, currency mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500Internal'

  /api/transactions:
    get:
      summary: Query paginated ledger transactions
      description: >
        Returns immutable double-entry journal entries ordered newest-first.
        CUSTOMERS see only transactions touching their own accounts.
        TELLER and ADMIN have global audit access.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
                  totalPages:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JournalEntry'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/statements/{accountId}:
    get:
      summary: Download monthly mini-statement PDF
      description: >
        Generates and streams an audited PDF statement with opening balance, postings,
        debit/credit lines, and closing balance for the specified month.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: month
          in: query
          required: false
          description: Statement month in YYYY-MM format (defaults to current month)
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
            example: "2026-10"
      responses:
        '200':
          description: Downloadable PDF document
          headers:
            Content-Type:
              schema:
                type: string
                example: application/pdf
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="statement-ACC-12345678-2026-10.pdf"'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /api/invariant/verify:
    get:
      summary: Execute system-wide ledger invariant audit (ADMIN only)
      description: >
        Performs read-only mathematical verification of double-entry equilibrium across the entire database:
        1. Journal Balance Invariant: SUM(Debits) == SUM(Credits) for every entry.
        2. Account Replay Invariant: Materialized balance matches complete historical replay from postings.
        3. System Drift: Total system discrepancy is exactly zero.
      responses:
        '200':
          description: Audit result report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvariantAuditResult'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Forbidden; non-ADMIN access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [CUSTOMER, TELLER, ADMIN]

    Account:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        accountNumber:
          type: string
          example: ACC-10928374
        iban:
          type: string
          example: GB29CLRG04000410928374
        type:
          type: string
          enum: [CURRENT, SAVINGS, SYSTEM_VAULT, SYSTEM_CLEARING, SYSTEM_FEES]
        status:
          type: string
          enum: [ACTIVE, FROZEN, DORMANT, CLOSED]
        currency:
          type: string
          example: USD
        balance:
          type: string
          description: Integer minor units (cents) serialized as string
          example: "100000"
        createdAt:
          type: string
          format: date-time

    AccountDetail:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            postings:
              type: array
              items:
                $ref: '#/components/schemas/LedgerPosting'

    LedgerPosting:
      type: object
      properties:
        id:
          type: string
        journalEntryId:
          type: string
        accountId:
          type: string
        direction:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: string
          description: Minor units (cents)
          example: "5000"
        currency:
          type: string
          example: USD
        balanceAfter:
          type: string
          example: "95000"
        sequence:
          type: integer
        createdAt:
          type: string
          format: date-time

    JournalEntry:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
          example: TXN-20261009-ABC123
        type:
          type: string
          enum: [TRANSFER, DEPOSIT, WITHDRAWAL, FEE, INTEREST, REVERSAL]
        description:
          type: string
        postedAt:
          type: string
          format: date-time
        postings:
          type: array
          items:
            $ref: '#/components/schemas/LedgerPosting'

    TransferResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        transaction:
          type: object
          properties:
            journalEntryId:
              type: string
            reference:
              type: string
            fromAccountId:
              type: string
            toAccountId:
              type: string
            amount:
              type: string
            currency:
              type: string
            fromBalanceAfter:
              type: string
            toBalanceAfter:
              type: string
            postedAt:
              type: string
              format: date-time

    InvariantAuditResult:
      type: object
      properties:
        healthy:
          type: boolean
          example: true
        journalsChecked:
          type: integer
        postingsChecked:
          type: integer
        accountsChecked:
          type: integer
        totalSystemDrift:
          type: string
          example: "0"
        unbalancedJournals:
          type: array
          items:
            type: object
            properties:
              journalId:
                type: string
              reference:
                type: string
              debitSum:
                type: string
              creditSum:
                type: string
              drift:
                type: string
        inconsistentAccounts:
          type: array
          items:
            type: object
            properties:
              accountId:
                type: string
              accountNumber:
                type: string
              iban:
                type: string
              accountType:
                type: string
              materializedBalance:
                type: string
              replayBalance:
                type: string
              drift:
                type: string
        checkedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string

  responses:
    400BadRequest:
      description: Invalid request parameters or payload format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    401Unauthorized:
      description: Authentication required or session expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    403Forbidden:
      description: Access denied by role-based access control or account ownership mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    404NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    500Internal:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
